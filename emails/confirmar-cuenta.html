<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Pide a Apple Mail / Gmail que NO den vuelta los colores en modo oscuro -->
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<style>
  :root { color-scheme: light only; supported-color-schemes: light only; }
  body { margin:0; padding:0; background:#f3eef0; }
  [data-ogsc] .hdr, [data-ogsb] .hdr { background:#521020 !important; }
</style>
</head>
<body style="margin:0;padding:0;background:#f3eef0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3eef0" style="background:#f3eef0;">
<tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="440" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:440px;background:#ffffff;border-radius:16px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
    <tr><td class="hdr" align="center" bgcolor="#521020" style="background:#521020;padding:28px 24px;">
      <img src="{{ .SiteURL }}/icon-512.png" width="88" height="88" alt="A los Palos" style="display:block;width:88px;height:88px;border:0;border-radius:20px;margin:0 auto;">
      <div style="color:#ffffff;font-size:22px;font-weight:bold;letter-spacing:1px;margin-top:12px;">A LOS PALOS</div>
      <div style="color:#f1d9df;font-size:12px;letter-spacing:2px;">CLUB LOS MOLINOS</div>
    </td></tr>
    <tr><td height="2" bgcolor="#121012" style="background:#121012;height:2px;line-height:2px;font-size:0;">&nbsp;</td></tr>
    <tr><td height="2" bgcolor="#ffffff" style="background:#ffffff;height:2px;line-height:2px;font-size:0;">&nbsp;</td></tr>
    <tr><td height="2" bgcolor="#121012" style="background:#121012;height:2px;line-height:2px;font-size:0;">&nbsp;</td></tr>
    <tr><td style="padding:28px 24px;color:#1e0a10;font-size:15px;line-height:1.5;">
      <p style="margin:0 0 12px;font-size:18px;font-weight:bold;color:#1e0a10;">¡Ya casi estás!</p>
      <p style="margin:0 0 24px;color:#1e0a10;">Tocá el botón para confirmar tu mail y empezar a cargar tus patadas.</p>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto 24px;">
        <tr><td align="center" bgcolor="#521020" style="background:#521020;border-radius:999px;">
          <a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=signup" style="display:inline-block;padding:14px 28px;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:999px;">Confirmar mi cuenta</a>
        </td></tr>
      </table>
      <p style="margin:0;color:#775660;font-size:13px;">Si no creaste una cuenta en A los Palos, ignorá este mail.</p>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
